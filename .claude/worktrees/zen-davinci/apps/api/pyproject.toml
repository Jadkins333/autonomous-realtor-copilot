[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM"]
ignore = ["S101", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["apps"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
 "ignore:.*crypt.*deprecated.*:DeprecationWarning:passlib.utils"
]
