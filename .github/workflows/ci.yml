name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bring up core stack
        run: docker compose up -d --build db redis api worker beat web

      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose ps
          docker compose logs --no-color --tail=200 api
          exit 1

      - name: Smoke test
        run: pnpm smoke

      - name: Web build
        run: pnpm --filter web build

      - name: Mobile typecheck
        run: pnpm --filter mobile exec tsc --noEmit

      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300
