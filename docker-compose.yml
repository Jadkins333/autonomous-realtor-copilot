services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-realtor_copilot}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-realtor_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/realtor_copilot
      REDIS_URL: redis://redis:6379/0
      SANDBOX_MODE: ${SANDBOX_MODE:-true}
      SEED_DETERMINISTIC_ONLY: ${SEED_DETERMINISTIC_ONLY:-true}
      NEXT_PUBLIC_API_URL: http://api:8000
      SEED_DIR: /tmp/app_seed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./docs:/workspace-docs:ro

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["bash", "scripts/start_worker.sh"]
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/realtor_copilot
      REDIS_URL: redis://redis:6379/0
      SEED_DIR: /tmp/app_seed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./docs:/workspace-docs:ro

  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["bash", "scripts/start_beat.sh"]
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/realtor_copilot
      REDIS_URL: redis://redis:6379/0
      SEED_DIR: /tmp/app_seed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./docs:/workspace-docs:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env.example
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_BASE_URL: /api/proxy
      API_INTERNAL_URL: http://api:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-nextauth}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-agent@demo.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo123}
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"
volumes:
  pg_data:
